<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunglasses Shop</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .auth-section, .section {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .auth-section h2, h2 {
            color: #667eea;
            margin-bottom: 15px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .auth-form { display: flex; gap: 10px; flex-wrap: wrap; }

        .auth-form input {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            flex: 1;
            min-width: 150px;
        }

        .auth-form button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .auth-form button:hover { background: #5568d3; }

        .auth-status { margin-top: 10px; padding: 10px; border-radius: 5px; font-weight: bold; }
        .auth-status.success { background: #d4edda; color: #155724; }
        .auth-status.error { background: #f8d7da; color: #721c24; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .card {
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
            border-color: #667eea;
        }

        .card h3 { color: #333; margin-bottom: 10px; }
        .card p { color: #666; margin: 5px 0; }

        .price { color: #667eea; font-size: 1.3em; font-weight: bold; margin: 10px 0; }

        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
        }

        .btn:hover { background: #5568d3; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }

        .loading { text-align: center; padding: 40px; color: #667eea; font-size: 1.2em; }
        .error { background: #f8d7da; color: #721c24; padding: 15px; border-radius: 5px; margin: 10px 0; }
        .empty-state { text-align: center; padding: 40px; color: #999; }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .cart-item-info { flex: 1; }

        .cart-item-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        /* Quantity controls */
        .qty-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .qty-btn {
            width: 30px;
            height: 30px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qty-btn:hover { background: #667eea; color: white; }

        .qty-display {
            font-size: 16px;
            font-weight: bold;
            min-width: 30px;
            text-align: center;
        }

        .remove-btn {
            padding: 5px 15px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .remove-btn:hover { background: #c82333; }

        .cart-total {
            text-align: right;
            font-size: 1.3em;
            font-weight: bold;
            color: #667eea;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid #e0e0e0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🕶️ Sunglasses Shop</h1>

        <div class="auth-section">
            <h2>Login</h2>
            <div class="auth-form">
                <input type="text" id="email" placeholder="Email">
                <input type="password" id="password" placeholder="Password">
                <button onclick="login()">Login</button>
                <button onclick="logout()" style="background: #dc3545;">Logout</button>
            </div>
            <div id="authStatus"></div>
        </div>

        <div class="section">
            <h2>Brands</h2>
            <div id="brandsContainer" class="loading">Loading brands...</div>
        </div>

        <div class="section">
            <h2>Products</h2>
            <div id="productsContainer" class="loading">Loading products...</div>
        </div>

        <div class="section">
            <h2>My Cart</h2>
            <div id="cartContainer" class="empty-state">Login to view your cart</div>
        </div>
    </div>

    <script>

        const API_URL = 'http://localhost:3000';
        let authToken = null;

        async function loadBrands() {
            try {
                const response = await fetch(`${API_URL}/api/brands`);
                const brands = await response.json();
                const container = document.getElementById('brandsContainer');

                if (brands.length === 0) {
                    container.innerHTML = '<div class="empty-state">No brands available yet</div>';
                    return;
                }

                container.innerHTML = '';
                container.className = 'grid';
                brands.forEach(brand => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <h3>${brand.name}</h3>
                        <p>${brand.description || 'Premium eyewear brand'}</p>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                document.getElementById('brandsContainer').innerHTML =
                    `<div class="error">Error loading brands: ${error.message}</div>`;
            }
        }

        async function loadProducts() {
            try {
                const response = await fetch(`${API_URL}/api/products`);
                const products = await response.json();
                const container = document.getElementById('productsContainer');

                if (products.length === 0) {
                    container.innerHTML = '<div class="empty-state">No products available yet</div>';
                    return;
                }

                container.innerHTML = '';
                container.className = 'grid';
                products.forEach(product => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <h3>${product.name}</h3>
                        <p>${product.description || 'Stylish sunglasses'}</p>
                        <div class="price">$${product.price || '0.00'}</div>
                        <button class="btn" onclick="addToCart('${product.id}')" ${!authToken ? 'disabled' : ''}>
                            ${authToken ? 'Add to Cart' : 'Login to Add'}
                        </button>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                document.getElementById('productsContainer').innerHTML =
                    `<div class="error">Error loading products: ${error.message}</div>`;
            }
        }

        async function loadCart() {
            const container = document.getElementById('cartContainer');

            if (!authToken) {
                container.innerHTML = '<div class="empty-state">Please login to view your cart</div>';
                return;
            }

            try {
                const response = await fetch(`${API_URL}/api/me/cart`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });

                if (!response.ok) throw new Error('Failed to load cart');

                // FIX 2: Cart is { items, totalPrice }, not an array
                const cart = await response.json();
                const items = cart.items || [];

                if (items.length === 0) {
                    container.innerHTML = '<div class="empty-state">Your cart is empty</div>';
                    return;
                }

                container.innerHTML = '';

                items.forEach(item => {
                    const cartItem = document.createElement('div');
                    cartItem.className = 'cart-item';
                    cartItem.innerHTML = `
                        <div class="cart-item-info">
                            <h3>${item.name}</h3>
                            <div class="price">$${item.price}</div>
                        </div>
                        <div class="cart-item-actions">
                            <div class="qty-controls">
                                <button class="qty-btn" onclick="updateQuantity('${item.productId}', ${item.quantity - 1})">−</button>
                                <span class="qty-display">${item.quantity}</span>
                                <button class="qty-btn" onclick="updateQuantity('${item.productId}', ${item.quantity + 1})">+</button>
                            </div>
                            <button class="remove-btn" onclick="removeFromCart('${item.productId}')">Remove</button>
                        </div>
                    `;
                    container.appendChild(cartItem);
                });

                const total = document.createElement('div');
                total.className = 'cart-total';
                total.textContent = `Total: $${cart.totalPrice}`;
                container.appendChild(total);

                const checkoutBtn = document.createElement('button');
                checkoutBtn.className = 'btn';
                checkoutBtn.style.marginTop = '15px';
                checkoutBtn.textContent = 'Proceed to Checkout →';
                checkoutBtn.onclick = () => window.location.href = '/checkout.html';
                container.appendChild(checkoutBtn);

            } catch (error) {
                container.innerHTML = `<div class="error">Error loading cart: ${error.message}</div>`;
            }
        }

        async function login() {
            // FIX 3: Send 'email' not 'username'
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const statusDiv = document.getElementById('authStatus');

            try {
                const response = await fetch(`${API_URL}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                if (response.ok) {
                    const data = await response.json();
                    authToken = data.token;
                    localStorage.setItem('authToken', authToken);
                    statusDiv.className = 'auth-status success';
                    statusDiv.textContent = '✓ Logged in successfully!';
                    loadCart();
                    loadProducts();
                } else {
                    statusDiv.className = 'auth-status error';
                    statusDiv.textContent = '✗ Invalid credentials';
                }
            } catch (error) {
                statusDiv.className = 'auth-status error';
                statusDiv.textContent = `✗ Error: ${error.message}`;
            }
        }

        function logout() {
            authToken = null;
            localStorage.removeItem('authToken');
            document.getElementById('authStatus').className = 'auth-status';
            document.getElementById('authStatus').textContent = '';
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
            loadCart();
            loadProducts();
        }

        async function addToCart(productId) {
            if (!authToken) return;

            try {
                // FIX 4: Must send quantity (was missing)
                const response = await fetch(`${API_URL}/api/me/cart`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ productId, quantity: 1 })
                });

                if (response.ok) loadCart();
            } catch (error) {
                alert(`Error: ${error.message}`);
            }
        }

        // NEW: Update quantity using PATCH /api/me/cart/:productId
        async function updateQuantity(productId, newQuantity) {
            if (!authToken) return;

            // If quantity drops to 0, remove the item instead
            if (newQuantity < 1) {
                return removeFromCart(productId);
            }

            try {
                const response = await fetch(`${API_URL}/api/me/cart/${productId}`, {
                    method: 'PATCH',
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ quantity: newQuantity })
                });

                if (response.ok) loadCart();
                else alert('Failed to update quantity');
            } catch (error) {
                alert(`Error: ${error.message}`);
            }
        }

        async function removeFromCart(productId) {
            if (!authToken) return;

            try {
                const response = await fetch(`${API_URL}/api/me/cart/${productId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });

                if (response.ok) loadCart();
            } catch (error) {
                alert(`Error: ${error.message}`);
            }
        }

        loadBrands();
        loadProducts();
        loadCart();    
    </script>
</body>
</html>
